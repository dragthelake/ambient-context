[package]
name = "ambient-context"
version = "0.1.0"
description = "A menu bar app that keeps a written record of what you worked on."
authors = ["Cameron Smith"]
edition = "2021"

[lib]
name = "ambient_context_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1.0.8", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
swift-rs = "1.0.8"

[dev-dependencies]
tempfile = "3"
