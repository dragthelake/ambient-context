name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-14
    # A healthy run compiles in about four minutes and notarises in a few more.
    # Anything past this is Apple's notary queue, not a slow build: on
    # 2026-09-03 two runs sat at "Notarizing" for 1h50m each while their
    # submissions stayed In Progress on Apple's side. Cap it so a stalled queue
    # fails fast with a readable log instead of running down the six-hour
    # default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Kept in step with the volta pin in package.json, so a release is
          # built on the runtime the app is developed against.
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ambient Context ${{ github.ref_name }}
          releaseDraft: true
          args: --target aarch64-apple-darwin

      # tauri-action names the disk image "Ambient Context_1.0.1_aarch64.dmg"
      # and GitHub turns the space into a dot on upload. Two cleaner names
      # replace it on the draft: a versioned one for the Releases page, and a
      # fixed one so a direct download link never goes stale between
      # releases. The updater bundle and its signature are left alone;
      # latest.json points at them.
      - name: Name the disk image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          built="$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$built" || { echo "no dmg under the bundle directory" >&2; exit 1; }
          cp "$built" "Ambient-Context-${version}.dmg"
          cp "$built" "Ambient-Context.dmg"
          gh release upload "$TAG" "Ambient-Context-${version}.dmg" "Ambient-Context.dmg" --clobber
          # The asset name GitHub gave the original, spaces already dotted.
          original="$(basename "$built" | tr ' ' '.')"
          gh release delete-asset "$TAG" "$original" --yes
          gh release view "$TAG" --json assets --jq '.assets[].name'
